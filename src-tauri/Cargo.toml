[package]
name = "repo-multi-check-widget"
version = "0.1.0"
description = "Desktop widget for multi-repo git/svn status"
authors = ["cykim"]
edition = "2021"

[lib]
name = "repo_multi_check_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
auto-launch = "0.5"
tauri-plugin-window-state = "2"
winreg = "0.55"
windows-version = "0.1"
# 유리 효과(glass.rs): 위젯 뒤 화면을 캡처해 웹뷰로 넘긴다. tauri가 쓰는 windows 0.61과 버전을 맞춘다.
windows = { version = "0.61", features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
